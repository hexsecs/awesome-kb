openshelf: '0.1'
kbs:
- id: awesome-kb-automotive-security
  source: github:hexsecs/awesome-kb-automotive-security
  use: when a task involves automotive security, vehicle networks, diagnostics, ECU
    firmware, RF/key fobs, or EV charging security
- id: awesome-kb-security
  source: github:hexsecs/awesome-kb-security
  use: when a task involves security tools, research, or practice across
    offensive and defensive security (not automotive-specific)
- id: awesome-kb-ai-llm-agents
  source: github:hexsecs/awesome-kb-ai-llm-agents
  use: when a task involves AI or LLM agents — frameworks, tools, protocols,
    evaluations, or research on autonomous and agentic systems
- id: awesome-kb-embedded-security
  source: github:hexsecs/awesome-kb-embedded-security
  use: when a task involves embedded security — firmware analysis, reverse
    engineering, hardware hacking, IoT security, fuzzing, secure boot,
    side-channel analysis, or SDR
