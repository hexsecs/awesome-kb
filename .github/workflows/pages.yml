name: Build and deploy the composed site

# Build-time federation: renders this KB plus every KB pinned in
# .openshelf/kbs.lock into one static site and deploys it to Pages.
# This workflow composes only the public KBs registered here. Private
# imports are built locally or in private CI, where the credentials
# live, and published only to access-controlled hosting — never here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder dependencies
        run: pip install pyyaml markdown
      - name: Build the composed site
        run: python3 tools/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
